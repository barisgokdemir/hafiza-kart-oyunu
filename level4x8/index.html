<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zor: Hayvanlar | Hafıza Kart Oyunu</title>
    <link rel="icon" href="../agac/favicon.png" type="image/png">
    <link rel="stylesheet" href="../ortak/style.css">
</head>

<body data-tema="hayvan">

    <div class="sideMenü">
        <input type="button" class="Rbutton" value="Ana Menü" data-islem="menu">
        <input type="button" class="Rbutton" value="Sesi kapat/aç" data-islem="ses">
    </div>
    <div class="sizeMenu">Ekran Boyutu
        <input type="button" class="sizeButton" value="1.5x" data-islem="boyut" data-kart="size15x" data-numara="spanSize15x">
        <input type="button" class="sizeButton" value="1.3x" data-islem="boyut" data-kart="size13x" data-numara="spanSize13x">
        <input type="button" class="sizeButton" value="1x" data-islem="boyut" data-kart="size1x" data-numara="spanSize1x">
    </div>

    <div class="state" aria-live="polite">
        <div class="point" title="Puan">0</div>
        <div class="time" title="Süre">0:0</div>
        <div class="guessCount" title="Kalan tahmin hakkı"></div>
    </div>

    <div class="Result" role="dialog" aria-label="Oyun sonucu">
        <div class="Rstate"></div>
        <div class="Rskor"></div>
        <div class="Rtime"></div>
        <div class="Rrekor"></div>
        <input class="Rbutton" type="button" value="Yeniden Başlat" data-islem="yeniden">
        <!-- Son seviye: Sonraki Level düğmesi gizlenir (ilk sürümde var olmayan bir sayfaya gidiyordu) -->
        <input class="Rbutton" type="button" value="Sonraki Level" data-islem="sonraki">
    </div>

    <div class="game" aria-label="Kartlar"></div>

    <script>
        window.SEVIYE = {
            anahtar: 'level4x8',
            klasor: '../hayvanlar/',
            onek: 'hayvan',
            resimAciklamasi: 'Hayvan ve yavrusu',
            ciftSayisi: 16,
            sutun: 8,
            sure: 180,
            tahminHakki: 30,
            sonraki: null
        };
    </script>
    <script src="../ortak/ses.js"></script>
    <script src="../ortak/oyun.js"></script>
</body>

</html>
